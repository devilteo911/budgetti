name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Drift tests open the system library by its path.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the Flutter used to cut releases.
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
